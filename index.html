<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>문학연구소 · 수능 문학 분석 플랫폼</title>
  <meta name="description" content="성산별곡, 탄궁가 등 수능 고전문학·현대문학 작품을 구절 단위로 분석하는 학습 플랫폼">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
/* 문학연구소 · 1단계 스타일 (흰색/검은색 미니멀) */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #666666;
  --line: #e3e3e3;
  --soft: #f6f6f6;
  --radius: 8px;
  --max: 1120px;
  --font: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Noto Sans KR", "Malgun Gothic", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 120px; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 16px; line-height: 1.65;
  -webkit-text-size-adjust: 100%; word-break: keep-all;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
ul, ol { margin: 0; padding: 0; list-style: none; }
h1, h2, h3, p { margin: 0; }

.wrap { max-width: var(--max); margin: 0 auto; padding: 0 20px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
.skip {
  position: absolute; left: -999px; top: 0; background: var(--fg); color: #fff; padding: 8px 12px;
}
.skip:focus { left: 8px; top: 8px; z-index: 100; }

:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* 버튼 */
.btn {
  border: 1px solid var(--fg); border-radius: var(--radius);
  padding: 9px 16px; font-size: 14px; font-weight: 600; line-height: 1.2;
  min-height: 40px;
}
.btn-solid { background: var(--fg); color: #fff; }
.btn-solid:hover { background: #333; }
.btn-ghost { background: #fff; color: var(--fg); }
.btn-ghost:hover { background: var(--soft); }
.link-btn { background: none; border: 0; color: var(--muted); font-size: 14px; text-decoration: underline; padding: 8px 0; }
.link-btn:hover { color: var(--fg); }

/* 헤더 */
.site-header {
  position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
}
.header-row { display: flex; align-items: center; gap: 24px; min-height: 64px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -0.02em; }
.logo-mark {
  display: inline-grid; place-items: center; width: 32px; height: 32px;
  background: var(--fg); color: #fff; border-radius: 6px; font-size: 17px; font-weight: 700;
}
.gnb { display: flex; gap: 22px; margin-left: 8px; font-size: 15px; font-weight: 500; color: #333; }
.gnb a { padding: 8px 0; }
.gnb a:hover { text-decoration: underline; text-underline-offset: 6px; }
.auth { margin-left: auto; display: flex; gap: 8px; }

/* 히어로 */
.hero { padding: 64px 0 36px; border-bottom: 1px solid var(--line); }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin-bottom: 14px; }
.hero h1 { font-size: clamp(28px, 5vw, 46px); line-height: 1.25; letter-spacing: -0.03em; font-weight: 800; }
.lead { margin-top: 16px; color: var(--muted); font-size: 17px; max-width: 560px; }

.search { display: flex; gap: 8px; margin-top: 30px; max-width: 680px; }
.search input {
  flex: 1; min-width: 0; height: 52px; padding: 0 16px; font-size: 16px; font-family: inherit;
  border: 1.5px solid var(--fg); border-radius: var(--radius); background: #fff; color: var(--fg);
}
.search .btn { height: 52px; padding: 0 24px; font-size: 15px; }

.filters { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px 24px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: #fff; color: #333; border-radius: 999px;
  padding: 7px 14px; font-size: 14px; min-height: 36px;
}
.chip:hover { border-color: var(--fg); }
.chip.is-on { background: var(--fg); border-color: var(--fg); color: #fff; }

.sample-note {
  margin-top: 20px; padding: 12px 14px; background: var(--soft); border-left: 3px solid var(--fg);
  font-size: 14px; color: #333; border-radius: 0 var(--radius) var(--radius) 0;
}

/* 섹션 */
.block { padding: 44px 0 8px; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
.block-head h2 { font-size: 22px; letter-spacing: -0.02em; font-weight: 800; }
.count { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 6px; }

/* 분류 카드 */
.cat-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.cat-card {
  display: flex; flex-direction: column; gap: 4px; padding: 20px;
  border: 1px solid var(--line); border-radius: var(--radius); background: #fff;
}
.cat-card:hover { border-color: var(--fg); }
.cat-name { font-weight: 700; font-size: 17px; }
.cat-desc { font-size: 14px; color: var(--muted); }
.cat-count { margin-top: 8px; font-size: 13px; font-weight: 600; }

/* 작품 카드 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card {
  text-align: left; background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; display: flex; flex-direction: column; gap: 10px; width: 100%; color: inherit;
}
.card:hover { border-color: var(--fg); }
.card-top { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.card-title { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; }
.card-meta { font-size: 14px; color: var(--muted); }
.card-sum { font-size: 14px; color: #333; line-height: 1.6; }
.card-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.price { font-weight: 700; color: var(--fg); }

.badge {
  display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px;
  line-height: 1.6; border: 1px solid var(--fg);
}
.badge-free { background: #fff; color: var(--fg); }
.badge-premium { background: var(--fg); color: #fff; }
.badge-tag { border-color: var(--line); color: var(--muted); font-weight: 500; }

/* 인기 순위 */
.rank { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 28px; }
.rank li { border-bottom: 1px solid var(--line); }
.rank button {
  width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 4px;
  background: none; border: 0; text-align: left; color: inherit;
}
.rank button:hover .rank-title { text-decoration: underline; text-underline-offset: 4px; }
.rank-no { font-size: 20px; font-weight: 800; width: 28px; flex: none; }
.rank-body { flex: 1; min-width: 0; }
.rank-title { font-weight: 700; display: block; }
.rank-meta { font-size: 13px; color: var(--muted); }

/* 무료/프리미엄 */
.plans { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.plan { border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.plan-premium { border-color: var(--fg); border-width: 1.5px; }
.plan h3 { font-size: 18px; display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.plan li { padding: 6px 0 6px 18px; position: relative; font-size: 15px; }
.plan li::before { content: ""; position: absolute; left: 2px; top: 16px; width: 6px; height: 6px; background: var(--fg); border-radius: 50%; }
.fine { margin-top: 14px; font-size: 13px; color: var(--muted); }

.empty { padding: 36px 0; color: var(--muted); text-align: center; }

/* 푸터 */
.site-footer { margin-top: 64px; border-top: 1px solid var(--line); padding: 26px 0; font-size: 14px; color: var(--muted); }
.footer-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; }
.footer-row strong { color: var(--fg); }

/* 대화상자 */
dialog { border: 1px solid var(--fg); border-radius: 10px; padding: 0; max-width: min(420px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog form { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
dialog h2 { font-size: 19px; }
dialog p { color: #333; font-size: 15px; }
dialog .btn { align-self: flex-end; }

/* 태블릿 */
@media (max-width: 900px) {
  .cat-cards { grid-template-columns: 1fr; }
  .rank { grid-template-columns: 1fr; }
}

/* 모바일 */
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .header-row { gap: 0 12px; min-height: 56px; padding-top: 8px; }
  .logo { font-size: 17px; }
  .auth { margin-left: auto; }
  .auth .btn { padding: 8px 12px; min-height: 38px; }
  .gnb { order: 3; width: 100%; margin: 0; gap: 18px; overflow-x: auto; white-space: nowrap; font-size: 14px; padding-bottom: 2px; }
  .hero { padding: 36px 0 26px; }
  .search .btn { padding: 0 16px; }
  .plans { grid-template-columns: 1fr; }
  .block { padding-top: 34px; }
  html { scroll-padding-top: 110px; }
}

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

/* ===== 3단계: 페이지 공통 / 목록 / 상세 ===== */
.page-top { padding: 28px 0 22px; border-bottom: 1px solid var(--line); }
.page-title { font-size: clamp(26px, 4.5vw, 38px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.25; margin: 10px 0 6px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--muted); }
.crumbs a:hover { text-decoration: underline; }
.crumbs a::after, .crumbs span:not(:last-child)::after { content: "›"; margin-left: 6px; color: #aaa; }
.page-top .search { margin-top: 18px; }
.page-top .filters { margin-top: 14px; }
.reset-row { margin-top: 16px; text-align: center; }
a.card { display: flex; }
.rank a { display: flex; align-items: center; gap: 14px; padding: 14px 4px; width: 100%; }
.rank a:hover .rank-title { text-decoration: underline; text-underline-offset: 4px; }

.work-head { display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
.work-head .lead { margin-top: 10px; }
.buy { display: flex; align-items: center; gap: 14px; }
.price.big { font-size: 22px; }

.detail-layout { display: grid; grid-template-columns: 240px 1fr; gap: 40px; padding-top: 28px; align-items: start; }
.toc { position: sticky; top: 84px; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; max-height: calc(100vh - 110px); overflow-y: auto; }
.toc h3 { font-size: 14px; margin-bottom: 8px; }
.toc ol { list-style: none; }
.toc button {
  display: flex; gap: 8px; width: 100%; text-align: left; background: none; border: 0;
  padding: 7px 4px; font-size: 14px; color: var(--fg); border-radius: 4px; line-height: 1.4;
}
.toc button:hover { background: var(--soft); }
.toc button.is-locked { color: #999; }
.toc-no { width: 18px; flex: none; color: var(--muted); font-weight: 600; }

.detail-body { min-width: 0; }
.sec { padding: 0 0 34px; margin-bottom: 34px; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.sec-no { display: inline-grid; place-items: center; min-width: 26px; height: 26px; background: var(--fg); color: #fff; font-size: 13px; border-radius: 4px; }
.sec p { margin-bottom: 10px; }

.info { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
.info > div { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.info dt { width: 64px; flex: none; color: var(--muted); font-size: 14px; }
.info dd { margin: 0; font-weight: 500; }

.poem { padding: 22px 24px; background: var(--soft); border-radius: var(--radius); font-size: 17px; line-height: 2; }
.poem .stanza { margin-bottom: 18px; }
.poem .stanza:last-child { margin-bottom: 0; }

.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 10px 12px; text-align: left; vertical-align: top; }
.tbl th { background: var(--soft); }

.ana { padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; }
.ana h4 { font-size: 15px; margin: 0 0 6px; }
.ana p { margin: 0; font-size: 15px; }

.steps { list-style: none; counter-reset: s; }
.steps li { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.steps strong { width: 88px; flex: none; }

.bul { padding-left: 4px; }
.bul li { position: relative; padding: 5px 0 5px 18px; }
.bul li::before { content: ""; position: absolute; left: 2px; top: 15px; width: 6px; height: 6px; background: var(--fg); border-radius: 50%; }

.choice { border: 1px solid var(--line); border-left-width: 4px; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
.choice.ok { border-left-color: var(--fg); }
.choice.no { border-left-color: #aaa; background: #fafafa; }
.choice-head { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; font-size: 13px; }
.mark { font-weight: 700; border: 1px solid var(--fg); border-radius: 4px; padding: 1px 8px; }
.choice.ok .mark { background: var(--fg); color: #fff; }
.choice-no { color: var(--muted); }
.choice-text { font-weight: 600; margin-bottom: 6px !important; }
.choice-why { font-size: 14px; color: #333; margin: 0 !important; }

.lock { border: 1.5px dashed #999; border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.lock p { margin: 0; color: #444; font-size: 15px; }
.lock-soft { border-color: var(--line); color: var(--muted); }

@media (max-width: 900px) {
  .detail-layout { grid-template-columns: 1fr; gap: 12px; }
  .toc { position: static; max-height: none; }
  .toc ol { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .info { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .toc ol { grid-template-columns: 1fr; }
  .work-head { align-items: flex-start; }
  .poem { padding: 16px; font-size: 16px; }
}

/* ===== 4단계: 작업 버튼 / 오류 / 인쇄(PDF 저장) ===== */
.work-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; }
.muted { color: var(--muted); font-size: 13px; }
.err { margin: 10px 0; padding: 12px 14px; background: var(--soft); border-left: 3px solid var(--fg); font-size: 15px; word-break: break-all; }
.btn:disabled { opacity: .5; cursor: progress; }
.print-only { display: none; }

@media print {
  @page { margin: 16mm; }
  body { font-size: 11pt; color: #000; }
  .site-header, .site-footer, .toc, .buy, .crumbs, .sample-note, .work-actions, .skip, .lock .badge, dialog { display: none !important; }
  .page-top { border: 0; padding: 0 0 10px; }
  .detail-layout { display: block; padding: 0; }
  .sec { break-inside: auto; padding-bottom: 14px; margin-bottom: 14px; }
  .sec h2 { break-after: avoid; }
  .ana, .choice, .tbl tr, .poem { break-inside: avoid; }
  .poem, .choice.no, .tbl th { background: none; }
  .print-only { display: block; margin-top: 18px; font-size: 10pt; color: #555; border-top: 1px solid #999; padding-top: 8px; }
}

/* ===== 5단계: 회원 기능 (로그인/가입/마이페이지) ===== */
.auth { align-items: center; }
a.btn { display: inline-flex; align-items: center; justify-content: center; }
.auth-name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; color: var(--muted); margin-right: 4px; }
.auth-card { max-width: 440px; margin: 32px auto 0; }
.auth-card .page-title { margin-top: 0; font-size: 28px; }
.form { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.field label { font-size: 14px; font-weight: 600; }
.field input {
  height: 48px; padding: 0 14px; font-size: 16px; font-family: inherit; color: var(--fg); background: #fff;
  border: 1.5px solid #999; border-radius: var(--radius); width: 100%;
}
.field input:focus { border-color: var(--fg); outline: 2px solid var(--fg); outline-offset: 1px; }
.btn-block { width: 100%; min-height: 48px; font-size: 16px; }
.form-msg { min-height: 0; margin: 0; font-size: 14px; line-height: 1.5; }
.form-msg.is-error { color: #b00020; padding: 10px 12px; border-left: 3px solid #b00020; background: #fdf3f4; }
.form-msg.is-ok { color: #0a5c2a; padding: 10px 12px; border-left: 3px solid #0a7a2f; background: #f1faf4; }
.form-links { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin-top: 18px; font-size: 14px; }
.form-links a, .form-links .link-btn { color: var(--muted); text-decoration: underline; padding: 4px 0; }
.form-links a:hover, .form-links .link-btn:hover { color: var(--fg); }
.auth-card .fine { margin: 10px 0; }
.auth-card .btn-ghost { margin-top: 12px; }
.err a { text-decoration: underline; }

.my-layout { display: grid; gap: 22px; padding-top: 24px; max-width: 820px; }
.my-box { border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.my-box h2 { font-size: 18px; margin-bottom: 12px; }
.acct { grid-template-columns: 1fr; }
.form-inline { flex-direction: row; align-items: flex-end; margin-top: 14px; }
.form-inline .btn { height: 48px; }
.paid-list li { border-bottom: 1px solid var(--line); }
.paid-list a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 2px; font-weight: 600; }
.paid-list a:hover span:first-child { text-decoration: underline; text-underline-offset: 4px; }
.buy .muted { margin-left: 2px; }

@media (max-width: 640px) {
  .auth-name { display: none; }
  .auth-card { margin-top: 20px; }
  .form-inline { flex-direction: column; align-items: stretch; }
  .my-box { padding: 16px; }
}
@media print { .auth, .my-layout .form { display: none !important; } }

/* ===== 6단계: 관리자 ===== */
.admin-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
.admin-tabs a { padding: 9px 14px; border: 1px solid var(--line); border-radius: var(--radius); font-size: 14px; font-weight: 600; min-height: 40px; display: inline-flex; align-items: center; }
.admin-tabs a.is-on { background: var(--fg); color: #fff; border-color: var(--fg); }
.admin-body { padding-top: 24px; padding-bottom: 48px; }
.admin-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.adm-table td, .adm-table th { font-size: 14px; }
.adm-actions { white-space: nowrap; }
.adm-actions .btn { margin: 2px 4px 2px 0; }
.adm-box { border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 22px; }
.adm-box h2 { font-size: 18px; margin-bottom: 12px; }
.adm-danger { border-color: #b00020; }
.btn-danger { color: #b00020; border-color: #b00020; }
.adm-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.adm-form .field-wide { grid-column: 1 / -1; }
.adm-form input[type=text], .adm-form input[type=number], .adm-form input[type=search], .adm-form select, .adm-form textarea,
.adm-search input, .adm-search select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; font-size: 16px; background: #fff; color: var(--fg);
}
.adm-form textarea { resize: vertical; }
.hint { font-size: 12px; color: var(--muted); }
.chk { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; min-height: 40px; }
.chk input { width: 20px; height: 20px; flex: none; }
.chk-col { justify-content: flex-end; }
.is-hidden { display: none; }
.adm-search { display: flex; gap: 8px; margin-bottom: 16px; max-width: 520px; }
.adm-h { font-size: 17px; margin: 26px 0 10px; }
.crumbs-back { margin-bottom: 12px; }
.ed-sec { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; }
.ed-sec > summary { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; min-height: 44px; }
.sec-no { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; background: var(--soft); align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex: none; }
.ed-title { font-weight: 600; flex: 1; }
.ed-state { font-size: 12px; color: var(--muted); }
.ed-state.is-filled { color: #0a5c2a; font-weight: 600; }

  <script>

(function () {
  "use strict";

  var EXAMPLE_TAG = "예시(실제 기출 아님)";

  /* =====================================================================

     ===================================================================== */
  function norm(t) { return String(t == null ? "" : t).replace(/\r\n?/g, "\n").trim(); }
  function trimmed(a) { return a.map(function (s) { return s.trim(); }).filter(Boolean); }
  function blocks(t) { var n = norm(t); return n ? trimmed(n.split(/\n[ \t]*\n+/)) : []; }
  function lines(t) { var n = norm(t); return n ? trimmed(n.split("\n")) : []; }
  function needArray(d) { if (!Array.isArray(d)) throw new Error("저장된 형식이 달라 불러올 수 없습니다."); return d; }

  function pairs(t, hint) {
    return lines(t).map(function (l, i) {
      var k = l.indexOf("|");
      if (k < 1 || !l.slice(k + 1).trim()) {
        throw new Error("빈 줄을 뺀 " + (i + 1) + "번째 줄이 '" + hint + "' 형식이 아닙니다. (가운데 | 기호가 필요합니다)");
      }
      return [l.slice(0, k).trim(), l.slice(k + 1).trim()];
    });
  }
  function titledBlocks(t, hint) {
    return blocks(t).map(function (b, i) {
      var ls = trimmed(b.split("\n"));
      if (ls.length < 2) throw new Error((i + 1) + "번째 묶음: 첫 줄은 " + hint + ", 둘째 줄부터 내용을 써 주세요.");

  }

  var KINDS = {

    },
    bullets: {
      parse: function (t) { return lines(t); },
      ser: function (d) { return needArray(d).join("\n"); }

          if (ls.length < 2) throw new Error((i + 1) + "번째 선지: 둘째 줄부터 판단 근거를 써 주세요.");

                '<td class="adm-actions"><a class="btn btn-ghost" href="#/admin/work/' + esc(w.id) + '">편집</a>' +
                (w.is_published ? '<a class="btn btn-ghost" href="#/work/' + esc(w.slug) + '">보기</a>' : "") +
                '<button type="button" class="btn btn-ghost" data-pub="' + esc(w.id) + '" data-to="' + (w.is_published ? "0" : "1") + '">' + (w.is_published ? "비공개로" : "공개로") + "</button></td></tr>";
            }).join("") + "</tbody></table></div><p class=\"fine\">총 " + rows.length + "개 작품</p>";
          box.onclick = function (e) {
            var b = e.target.closest("[data-pub]"); if (!b) return;
            b.disabled = true;
            sb().from("works").update({ is_published: b.getAttribute("data-to") === "1" }).eq("id", b.getAttribute("data-pub")).then(function (u) {
              if (u.error) { b.disabled = false; ctx.showMessage("변경하지 못했습니다", u.error.message); return; }
              ctx.invalidateWorks(); viewWorks();
            });
          };
        }, function (e) { var box = $("admList"); if (box && my === ctx.token()) box.innerHTML = errBox(e); });
    }

    /* ---------- 작품 등록/수정 ---------- */
    function opt(v, label, cur) { return '<option value="' + esc(v) + '"' + (String(cur) === String(v) ? " selected" : "") + ">" + esc(label) + "</option>"; }

    function workFormHTML(w, cats) {
      var isNew = !w.id;
      return '<form id="workForm" class="adm-form" novalidate>' +
        '<div class="field"><label for="f_title">작품명 *</label><input id="f_title" type="text" maxlength="100" value="' + esc(w.title || "") + '"></div>' +
        '<div class="field"><label for="f_author">작가 *</label><input id="f_author" type="text" maxlength="60" value="' + esc(w.author || "") + '"></div>' +
        '<div class="field"><label for="f_era">시대</label><input id="f_era" type="text" maxlength="40" placeholder="예: 조선 전기, 1920년대" value="' + esc(w.era || "") + '"></div>' +
        '<div class="field"><label for="f_genre">갈래</label><input id="f_genre" type="text" maxlength="40" placeholder="예: 가사, 현대시, 현대소설" value="' + esc(w.genre || "") + '"></div>' +
        '<div class="field"><label for="f_cat">분류 *</label><select id="f_cat">' +
          cats.map(function (c) { return opt(c.id, c.name, w.category_id); }).join("") + "</select></div>" +
        '<div class="field"><label for="f_slug">주소 이름 (영문) *</label><input id="f_slug" type="text" maxlength="60" autocapitalize="none" placeholder="예: seongsan-byeolgok" value="' + esc(w.slug || "") + '">' +
          '<span class="hint">영문·숫자·-·_ 만 가능. 사이트 주소(#/work/이름)에 쓰입니다.' + (isNew ? "" : " 바꾸면 기존 링크가 끊깁니다.") + "</span></div>" +
        '<div class="field field-wide"><label for="f_summary">한 줄 요약 (카드에 표시)</label><textarea id="f_summary" rows="2" maxlength="200">' + esc(w.summary || "") + "</textarea></div>" +
        '<div class="field"><label for="f_access">이용 구분 *</label><select id="f_access">' + opt("free", "무료", w.access || "premium") + opt("premium", "프리미엄(유료)", w.access || "premium") + "</select></div>" +
        '<div class="field"><label for="f_price">가격 (원)</label><input id="f_price" type="number" inputmode="numeric" min="0" step="100" value="' + esc(w.price == null ? 0 : w.price) + '"><span class="hint">프리미엄은 100원 이상</span></div>' +
        '<div class="field"><label for="f_pop">인기 점수</label><input id="f_pop" type="number" inputmode="numeric" min="0" value="' + esc(w.popularity || 0) + '"><span class="hint">클수록 목록 위쪽에 나옵니다</span></div>' +
        '<div class="field chk-col"><label class="chk"><input id="f_exam" type="checkbox"' + (w.is_exam ? " checked" : "") + '> 수능·모의평가 기출 작품</label>' +
          '<label class="chk"><input id="f_pub" type="checkbox"' + (w.is_published ? " checked" : "") + '> 공개 (체크 해제 시 방문자에게 숨김)</label></div>' +
        '<div class="field field-wide"><p class="form-msg" id="workMsg" role="alert"></p><button type="submit" class="btn btn-solid">' + (isNew ? "작품 등록" : "작품 정보 저장") + "</button></div></form>";
    }

    function readWorkForm() {
      var v = function (id) { return $(id).value.trim(); };
      var access = $("f_access").value;
      var row = {
        title: v("f_title"), author: v("f_author"), era: v("f_era") || null, genre: v("f_genre") || null,
        category_id: Number($("f_cat").value), slug: v("f_slug"), summary: v("f_summary") || null,
        access: access, price: access === "free" ? 0 : parseInt($("f_price").value, 10),
        popularity: parseInt($("f_pop").value, 10) || 0, is_exam: $("f_exam").checked, is_published: $("f_pub").checked
      };
      if (!row.title) throw new Error("작품명을 입력해 주세요.");
      if (!row.author) throw new Error("작가를 입력해 주세요.");
      if (!row.category_id) throw new Error("분류를 선택해 주세요.");
      if (!/^[A-Za-z0-9_-]{1,60}$/.test(row.slug)) throw new Error("주소 이름은 영문·숫자·-·_ 만 쓸 수 있습니다. (예: seongsan-byeolgok)");
      if (access === "premium" && !(row.price >= 100 && row.price <= 10000000)) throw new Error("프리미엄 작품의 가격은 100원 이상 10,000,000원 이하로 입력해 주세요.");
      if (row.popularity < 0) row.popularity = 0;
      return row;
    }

    function dbErrText(e) {
      var m = (e && e.message) || "";
      if (e && (e.code === "23505" || /duplicate key|already exists/i.test(m))) return "이미 사용 중인 주소 이름입니다. 다른 이름을 입력해 주세요.";
      if (e && (e.code === "42501" || /row-level security|permission denied/i.test(m))) return "권한이 없습니다. 관리자 계정으로 로그인했는지 확인해 주세요.";
      return "저장하지 못했습니다. (" + m + ")";
    }

    function viewWorkForm(id) {
      var my = ctx.token();
      $("view").innerHTML = shell("/admin", loading());
      var none = Promise.resolve({ data: null, error: null }), noneList = Promise.resolve({ data: [], error: null });
      Promise.all([
        sb().from("categories").select("id,slug,name").order("sort"),
        id ? sb().from("works").select("*").eq("id", id).maybeSingle() : none,
        id ? sb().from("analyses").select("section_key,body,is_preview").eq("work_id", id) : noneList,
        id ? sb().from("work_files").select("id,file_name,storage_path,created_at").eq("work_id", id).order("created_at") : noneList
      ]).then(function (r) {
        if (my !== ctx.token()) return;
        for (var i = 0; i < r.length; i++) if (r[i].error) { $("view").innerHTML = shell("/admin", errBox(r[i].error)); return; }
        var cats = r[0].data || [], work = r[1].data;
        if (id && !work) { $("view").innerHTML = shell("/admin", '<p class="empty">작품을 찾을 수 없습니다. <a class="link-btn" href="#/admin">목록으로</a></p>'); return; }
        if (!cats.length) { $("view").innerHTML = shell("/admin", '<p class="err">분류(categories) 데이터가 없습니다. schema.sql 을 다시 실행해 주세요.</p>'); return; }
        work = work || { access: "premium", is_published: false };
        var existing = {}; (r[2].data || []).forEach(function (a) { existing[a.section_key] = a; });

        var inner = '<p class="crumbs-back"><a class="link-btn" href="#/admin">← 작품 목록</a></p>' +
          '<section class="adm-box"><h2>' + (id ? "작품 정보" : "새 작품 등록") + "</h2>" +
          (id ? "" : '<p class="fine">먼저 기본 정보를 저장하면 분석 자료와 PDF를 입력할 수 있습니다. 새 작품은 처음에 비공개로 두는 것을 권장합니다.</p>') +
          workFormHTML(work, cats) + "</section>";
        if (id) {
          inner += '<section class="adm-box" id="filesBox"><h2>PDF 파일</h2>' + filesHTML(work, r[3].data || []) + "</section>" +
            '<section class="adm-box"><h2>분석 자료 (14개 항목)</h2>' +
            (work.access === "premium" ? '<p class="fine">프리미엄 작품: 「구매 전에도 보이게」를 체크한 항목만 구매하지 않은 방문자에게 보입니다.</p>' : '<p class="fine">무료 작품은 입력한 모든 항목이 누구에게나 보입니다.</p>') +
            '<div id="edWrap">' + editorHTML(work, existing) + "</div></section>" +
            '<section class="adm-box adm-danger"><h2>작품 삭제</h2><p class="fine">분석 자료와 PDF가 함께 삭제되며 되돌릴 수 없습니다. 구매 내역이 있는 작품은 삭제할 수 없으니 「비공개」로 바꿔 주세요.</p>' +
            '<p class="form-msg" id="delMsg" role="alert"></p><button type="button" class="btn btn-ghost btn-danger" id="delWork">이 작품 삭제</button></section>';
        }
        $("view").innerHTML = shell("/admin", inner);
        document.title = (id ? work.title + " 편집" : "새 작품 등록") + " · 관리자";
        bindWorkForm(id, work);
        if (id) { bindEditor(work, existing); bindFiles(work); $("delWork").addEventListener("click", function () { deleteWork(work); }); }
      }, function (e) { if (my === ctx.token()) $("view").innerHTML = shell("/admin", errBox(e)); });
    }

    function bindWorkForm(id, work) {
      var access = $("f_access"), price = $("f_price");
      function syncPrice() { price.disabled = access.value === "free"; if (access.value === "free") price.value = 0; }
      access.addEventListener("change", syncPrice); syncPrice();
      $("workForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var msg = $("workMsg"), btn = e.target.querySelector("button[type=submit]"), row;
        try { row = readWorkForm(); } catch (err) { setMsg(msg, err.message); return; }
        setMsg(msg, ""); btn.disabled = true;
        var q = id ? sb().from("works").update(row).eq("id", id) : sb().from("works").insert(row).select("id").single();
        q.then(function (r) {
          btn.disabled = false;
          if (r.error) { setMsg(msg, dbErrText(r.error)); return; }
          ctx.invalidateWorks();
          if (!id) { ctx.go("/admin/work/" + r.data.id); return; }
          viewWorkForm(id);   // 가격/이용 구분이 바뀌었을 수 있어 화면을 다시 구성
        }, function (err) { btn.disabled = false; setMsg(msg, dbErrText(err)); });
      });
    }

    /* ---------- 분석 항목 편집기 ---------- */
    function editorHTML(work, existing) {
      return ctx.SECTIONS.map(function (s, i) {
        var def = DEFS[s.key], row = existing[s.key], text = "", warn = false, hasTag = false;
        if (row) {
          try { text = serSection(s.key, row.body); hasTag = def.kind === "choices" && row.body.some(function (c) { return c && c.tag; }); }
          catch (e) { text = ""; warn = true; }
        }
        var prev = row ? !!row.is_preview : PREVIEW_DEFAULT.indexOf(s.key) !== -1;
        return '<details class="ed-sec" data-key="' + s.key + '"><summary><span class="sec-no">' + (i + 1) + "</span><span class=\"ed-title\">" + esc(s.title) + '</span>' +
          '<span class="ed-state' + (row ? " is-filled" : "") + '">' + (row ? "입력됨" : "비어 있음") + "</span></summary>" +
          '<div class="ed-body"><p class="help">' + esc(def.help) + "</p>" +
          '<details class="ed-ex"><summary>입력 예시 보기</summary><pre>' + esc(def.ex) + "</pre></details>" +
          (warn ? '<p class="err">저장된 내용의 형식이 달라 불러오지 못했습니다. 새로 입력해 저장하면 덮어씁니다.</p>' : "") +
          '<textarea class="ed-text" rows="10" spellcheck="false" aria-label="' + esc(s.title) + '">' + esc(text) + "</textarea>" +
          '<label class="chk ed-prevwrap' + (work.access === "premium" ? "" : " is-hidden") + '"><input type="checkbox" class="ed-prev"' + (prev ? " checked" : "") + "> 구매 전에도 보이게 (미리보기 공개)</label>" +
          (def.kind === "choices" ? '<label class="chk"><input type="checkbox" class="ed-tag"' + (hasTag ? " checked" : "") + "> 직접 만든 예시 선지입니다 (「" + EXAMPLE_TAG + "」 표시 붙이기)</label>" : "") +
          '<div class="ed-actions"><button type="button" class="btn btn-solid" data-ed="save">이 항목 저장</button>' +
          '<button type="button" class="btn btn-ghost" data-ed="preview">미리보기</button>' +
          '<button type="button" class="btn btn-ghost" data-ed="clear">내용 지우기</button></div>' +
          '<p class="form-msg ed-msg" role="alert"></p><div class="ed-preview sec" hidden></div></div></details>';
      }).join("");
    }

    function bindEditor(work, existing) {
      var wrap = $("edWrap");
      wrap.addEventListener("click", function (e) {
        var b = e.target.closest("[data-ed]"); if (!b) return;
        var box = b.closest(".ed-sec"), key = box.getAttribute("data-key"), act = b.getAttribute("data-ed");
        var ta = box.querySelector(".ed-text"), msg = box.querySelector(".ed-msg"), pv = box.querySelector(".ed-preview");
        var tag = box.querySelector(".ed-tag"), state = box.querySelector(".ed-state");
        setMsg(msg, "");

        if (act === "clear") {
          if (!window.confirm("이 항목의 내용을 지울까요?")) return;
          b.disabled = true;
          sb().from("analyses").delete().eq("work_id", work.id).eq("section_key", key).then(function (r) {
            b.disabled = false;
            if (r.error) { setMsg(msg, dbErrText(r.error)); return; }
            ta.value = ""; pv.hidden = true; delete existing[key];
            state.textContent = "비어 있음"; state.className = "ed-state"; setMsg(msg, "삭제되었습니다.", true);
          });
          return;
        }

        var data;
        try { data = parseSection(key, ta.value, tag && tag.checked); } catch (err) { setMsg(msg, err.message); return; }
        if (!data) { setMsg(msg, act === "save" ? "내용이 비어 있습니다. 지우려면 「내용 지우기」를 누르세요." : "미리 볼 내용이 없습니다."); return; }

        if (act === "preview") {
          try { pv.innerHTML = ctx.RENDERERS[key](data); pv.hidden = false; } catch (err) { setMsg(msg, "미리보기를 만들지 못했습니다."); }
          return;
        }
        // save
        b.disabled = true;
        var row = { work_id: work.id, section_key: key, body: data, is_preview: box.querySelector(".ed-prev").checked, updated_at: new Date().toISOString() };
        sb().from("analyses").upsert(row, { onConflict: "work_id,section_key" }).then(function (r) {
          b.disabled = false;
          if (r.error) { setMsg(msg, dbErrText(r.error)); return; }
          existing[key] = { body: data, is_preview: row.is_preview };
          state.textContent = "입력됨"; state.className = "ed-state is-filled";
          setMsg(msg, "저장되었습니다. (" + data.length + "개)", true);
          if (!pv.hidden) pv.innerHTML = ctx.RENDERERS[key](data);
        }, function (err) { b.disabled = false; setMsg(msg, dbErrText(err)); });
      });
    }

    /* ---------- PDF ---------- */
    function filesHTML(work, files) {
      return '<div id="fileList">' + (files.length
        ? '<ul class="file-list">' + files.map(function (f) {
            return "<li><span class=\"file-name\">" + esc(f.file_name) + "</span><span class=\"muted\">" + day(f.created_at) + "</span>" +
              '<button type="button" class="btn btn-ghost" data-fdl="' + esc(f.storage_path) + '" data-name="' + esc(f.file_name) + '">내려받기</button>' +
              '<button type="button" class="btn btn-ghost btn-danger" data-fdel="' + esc(f.id) + '" data-path="' + esc(f.storage_path) + '">삭제</button></li>';
          }).join("") + "</ul>"
        : '<p class="empty-sm">등록된 PDF가 없습니다.</p>') + "</div>" +
        '<div class="upload-row"><input type="file" id="pdfInput" accept="application/pdf,.pdf"><button type="button" class="btn btn-solid" id="pdfUp">PDF 업로드</button></div>' +
        '<p class="fine">PDF는 최대 30MB. 프리미엄 작품의 PDF는 구매자와 관리자만 내려받을 수 있습니다.</p><p class="form-msg" id="fileMsg" role="alert"></p>';
    }
    function refreshFiles(work) {
      sb().from("work_files").select("id,file_name,storage_path,created_at").eq("work_id", work.id).order("created_at").then(function (r) {
        var box = $("filesBox"); if (!box) return;
        if (r.error) { setMsg($("fileMsg"), r.error.message); return; }
        box.innerHTML = "<h2>PDF 파일</h2>" + filesHTML(work, r.data || []);
        bindFiles(work);
      });
    }
    function bindFiles(work) {
      var box = $("filesBox"), msg = function (t, ok) { setMsg($("fileMsg"), t, ok); };
      $("pdfUp").addEventListener("click", function () {
        var f = $("pdfInput").files && $("pdfInput").files[0];
        if (!f) { msg("업로드할 PDF 파일을 먼저 선택해 주세요."); return; }
        if (!/\.pdf$/i.test(f.name) || (f.type && f.type !== "application/pdf")) { msg("PDF 파일(.pdf)만 올릴 수 있습니다."); return; }
        if (f.size > MAX_PDF) { msg("파일이 너무 큽니다. 30MB 이하로 줄여 주세요."); return; }
        if (f.size === 0) { msg("빈 파일입니다."); return; }
        // 저장 경로에는 한글/특수문자를 쓰지 않음(스토리지 오류 방지). 원래 이름은 DB 에 따로 저장.
        var path = work.id + "/" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8) + ".pdf";
        var up = $("pdfUp"); up.disabled = true; msg("업로드 중… 잠시 기다려 주세요.", true);
        sb().storage.from("work-files").upload(path, f, { contentType: "application/pdf", upsert: false }).then(function (r) {
          if (r.error) { up.disabled = false; msg("업로드하지 못했습니다. (" + r.error.message + ")"); return; }
          return sb().from("work_files").insert({ work_id: work.id, storage_path: path, file_name: f.name.slice(0, 120) }).then(function (ins) {
            if (ins.error) {
              sb().storage.from("work-files").remove([path]);   // 목록 등록에 실패하면 올린 파일도 정리
              up.disabled = false; msg(dbErrText(ins.error)); return;
            }
            refreshFiles(work);
          });
        }, function (err) { up.disabled = false; msg("업로드하지 못했습니다. (" + ((err && err.message) || err) + ")"); });
      });
      box.addEventListener("click", function (e) {
        var dl = e.target.closest("[data-fdl]"), del = e.target.closest("[data-fdel]");
        if (dl) {
          dl.disabled = true;
          sb().storage.from("work-files").createSignedUrl(dl.getAttribute("data-fdl"), 60, { download: dl.getAttribute("data-name") }).then(function (r) {
            dl.disabled = false;
            if (r.error || !r.data) { msg("내려받지 못했습니다. (" + ((r.error && r.error.message) || "오류") + ")"); return; }
            var a = document.createElement("a"); a.href = r.data.signedUrl; a.rel = "noopener"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
          });
        } else if (del) {
          if (!window.confirm("이 PDF를 삭제할까요? 구매자도 더 이상 내려받을 수 없습니다.")) return;
          del.disabled = true;
          sb().from("work_files").delete().eq("id", del.getAttribute("data-fdel")).then(function (r) {
            if (r.error) { del.disabled = false; msg(dbErrText(r.error)); return; }
            sb().storage.from("work-files").remove([del.getAttribute("data-path")]).then(function () { refreshFiles(work); });
          });
        }
      });
    }

    /* ---------- 작품 삭제 ---------- */
    function deleteWork(work) {
      var msg = $("delMsg");
      if (!window.confirm("「" + work.title + "」 작품을 삭제할까요?\n분석 자료와 PDF도 함께 삭제되며 되돌릴 수 없습니다.")) return;
      setMsg(msg, "");
      sb().from("work_files").select("storage_path").eq("work_id", work.id).then(function (fr) {
        var paths = ((fr && fr.data) || []).map(function (x) { return x.storage_path; });
        return sb().from("works").delete().eq("id", work.id).then(function (dr) {
          if (dr.error) {
            setMsg(msg, dr.error.code === "23503" || /foreign key/i.test(dr.error.message || "")
              ? "구매 내역이 있는 작품은 삭제할 수 없습니다. 「비공개」로 바꿔 주세요." : dbErrText(dr.error));
            return;
          }
          ctx.invalidateWorks();
          return Promise.resolve(paths.length ? sb().storage.from("work-files").remove(paths) : null).then(function () { ctx.go("/admin"); });
        });
      }, function (err) { setMsg(msg, dbErrText(err)); });
    }

    /* ---------- 회원 ---------- */
    function viewMembers(qs) {
      var my = ctx.token(), q = (qs.get("q") || "").trim();
      $("view").innerHTML = shell("/admin/members",
        '<form id="memSearch" class="adm-search"><input type="search" id="memQ" placeholder="이메일로 검색" value="' + esc(q) + '" aria-label="이메일 검색"><button class="btn btn-solid" type="submit">검색</button></form>' +
        '<div id="memList">' + loading() + "</div>");
      $("memSearch").addEventListener("submit", function (e) {
        e.preventDefault(); var v = $("memQ").value.trim();
        ctx.go("/admin/members" + (v ? "?q=" + encodeURIComponent(v) : ""));
      });
      var qb = sb().from("profiles").select("id,email,display_name,role,created_at", { count: "exact" });
      if (q) qb = qb.ilike("email", "%" + q.replace(/[%_\\]/g, "") + "%");
      qb.order("created_at", { ascending: false }).limit(100).then(function (r) {
        if (my !== ctx.token()) return;
        var box = $("memList"); if (!box) return;
        if (r.error) { box.innerHTML = errBox(r.error); return; }
        var rows = r.data || [];
        box.innerHTML = rows.length
          ? '<p class="fine">전체 ' + (r.count == null ? rows.length : r.count) + "명" + (rows.length < (r.count || 0) ? " 중 최근 100명 표시" : "") + '</p><div class="tbl-wrap"><table class="tbl adm-table"><thead><tr><th>이메일</th><th>표시 이름</th><th>권한</th><th>가입일</th></tr></thead><tbody>' +
            rows.map(function (m) {
              return "<tr><td>" + esc(m.email || "") + "</td><td>" + esc(m.display_name || "-") + "</td><td>" + (m.role === "admin" ? "관리자" : "회원") + "</td><td>" + day(m.created_at) + "</td></tr>";
            }).join("") + "</tbody></table></div><p class=\"fine\">회원 권한 변경은 보안을 위해 Supabase SQL Editor에서만 할 수 있습니다.</p>"
          : '<p class="empty">조건에 맞는 회원이 없습니다.</p>';
      }, function (e) { var box = $("memList"); if (box && my === ctx.token()) box.innerHTML = errBox(e); });
    }

    /* ---------- 구매 내역 + 수동 지급 ---------- */
    var GRANT_MSG = { granted: "지급했습니다.", already: "이미 열람 권한이 있는 회원입니다.", no_user: "해당 이메일의 회원이 없습니다. 먼저 가입해야 합니다.", no_work: "작품을 찾을 수 없습니다." };
    function rpcErr(e) {
      var m = (e && e.message) || "";
      if (/forbidden|permission denied/i.test(m) && !/function/i.test(m)) return "권한이 없습니다. 관리자 계정으로 로그인했는지 확인해 주세요.";
      if (/function|schema cache|PGRST202|404/i.test(m + ((e && e.code) || ""))) return "step7.sql 을 Supabase SQL Editor에서 먼저 실행해 주세요.";
      return "처리하지 못했습니다. (" + m + ")";
    }
    function viewPurchases(qs) {
      var my = ctx.token(), st = qs.get("status") || "";
      if (["paid", "pending", "cancelled", "refunded"].indexOf(st) === -1) st = "";
      var labels = ctx.statusLabel || {};
      $("view").innerHTML = shell("/admin/purchases",
        '<section class="adm-box"><h2>열람 권한 수동 지급</h2><p class="fine">결제가 아닌 관리자 지급(테스트·이벤트·오류 보상)입니다. 금액 0원, 「수동 지급」으로 기록되며 매출에는 0원으로 잡힙니다.</p>' +
        '<form id="grantForm" class="adm-form" novalidate><div class="field"><label for="g_email">회원 이메일</label><input id="g_email" type="text" inputmode="email" autocapitalize="none" placeholder="member@example.com"></div>' +
        '<div class="field"><label for="g_work">작품 (프리미엄)</label><select id="g_work"><option value="">불러오는 중…</option></select></div>' +
        '<div class="field field-wide"><p class="form-msg" id="grantMsg" role="alert"></p><button class="btn btn-solid" type="submit">지급하기</button></div></form></section>' +
        '<div class="adm-search"><label for="stSel" class="sr-only">상태</label><select id="stSel">' + opt("", "전체 상태", st) +
        ["paid", "pending", "cancelled", "refunded"].map(function (s) { return opt(s, labels[s] || s, st); }).join("") + '</select></div><div id="purList">' + loading() + "</div>");
      $("stSel").addEventListener("change", function () { ctx.go("/admin/purchases" + (this.value ? "?status=" + this.value : "")); });
      sb().from("works").select("id,title").eq("access", "premium").order("title").then(function (r) {
        var sel = $("g_work"); if (!sel || my !== ctx.token()) return;
        var rows = (r && r.data) || [];
        sel.innerHTML = rows.length ? rows.map(function (w) { return '<option value="' + esc(w.id) + '">' + esc(w.title) + "</option>"; }).join("") : '<option value="">프리미엄 작품이 없습니다</option>';
      });
      $("grantForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var msg = $("grantMsg"), email = $("g_email").value.trim(), wid = $("g_work").value, btn = e.target.querySelector("button[type=submit]");
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setMsg(msg, "이메일 형식이 올바르지 않습니다."); return; }
        if (!wid) { setMsg(msg, "작품을 선택해 주세요."); return; }
        if (!window.confirm(email + " 회원에게 이 작품의 열람 권한을 지급할까요?")) return;
        btn.disabled = true; setMsg(msg, "");
        sb().rpc("admin_grant_access", { p_email: email, p_work: wid }).then(function (r) {
          btn.disabled = false;
          if (r.error) { setMsg(msg, rpcErr(r.error)); return; }
          setMsg(msg, GRANT_MSG[r.data] || "처리되었습니다.", r.data === "granted");
          if (r.data === "granted") loadList();
        }, function (err) { btn.disabled = false; setMsg(msg, rpcErr(err)); });
      });

      function loadList() {
        var qb = sb().from("purchases").select("id,amount,status,created_at,paid_at,pg_provider,profiles(email),works(title)");
        if (st) qb = qb.eq("status", st);
        qb.order("created_at", { ascending: false }).limit(100).then(function (r) {
          if (my !== ctx.token()) return;
          var box = $("purList"); if (!box) return;
          if (r.error) { box.innerHTML = errBox(r.error); return; }
          var rows = r.data || [];
          box.innerHTML = rows.length
            ? '<div class="tbl-wrap"><table class="tbl adm-table"><thead><tr><th>일시</th><th>회원</th><th>작품</th><th>금액</th><th>상태</th><th></th></tr></thead><tbody>' +
              rows.map(function (p) {
                var manual = p.pg_provider === "manual";
                return "<tr><td>" + day(p.created_at) + "</td><td>" + esc(p.profiles ? p.profiles.email : "-") + "</td><td>" + esc(p.works ? p.works.title : "삭제된 작품") +
                  "</td><td>" + won(p.amount) + "</td><td>" + esc(labels[p.status] || p.status) + (manual ? '<br><span class="muted">수동 지급</span>' : p.pg_provider === "test" ? '<br><span class="muted">테스트 결제</span>' : "") + "</td><td>" +
                  (manual && p.status === "paid" ? '<button type="button" class="btn btn-ghost btn-danger" data-revoke="' + esc(p.id) + '">회수</button>' : "") + "</td></tr>";
              }).join("") + "</tbody></table></div><p class=\"fine\">최근 100건 표시. 실제 결제의 승인·취소·환불은 8단계(결제 시스템)에서 연결됩니다.</p>"
            : '<p class="empty">구매 내역이 없습니다.</p>';
          box.onclick = function (ev) {
            var b = ev.target.closest("[data-revoke]"); if (!b) return;
            if (!window.confirm("이 수동 지급을 회수할까요? 해당 회원은 더 이상 이 작품 전체를 볼 수 없습니다.")) return;
            b.disabled = true;
            sb().rpc("admin_revoke_manual", { p_purchase: b.getAttribute("data-revoke") }).then(function (x) {
              if (x.error) { b.disabled = false; ctx.showMessage("회수하지 못했습니다", rpcErr(x.error)); return; }
              loadList();
            });
          };
        }, function (e) { var box = $("purList"); if (box && my === ctx.token()) box.innerHTML = errBox(e); });
      }
      loadList();
    }

    /* ---------- 매출 통계 ---------- */
    function bars(rows, labelKey) {
      var max = rows.reduce(function (m, r) { return Math.max(m, r.amount); }, 0) || 1;
      return '<div class="tbl-wrap"><table class="tbl adm-table"><thead><tr><th>' + (labelKey === "month" ? "월" : "작품") + "</th><th>건수</th><th>매출</th><th></th></tr></thead><tbody>" +
        rows.map(function (r) {
          return "<tr><td>" + esc(r[labelKey]) + "</td><td>" + esc(r.cnt) + "건</td><td>" + won(r.amount) + '</td><td class="bar-cell"><span class="bar" style="width:' + Math.max(2, Math.round(r.amount / max * 100)) + '%"></span></td></tr>';
        }).join("") + "</tbody></table></div>";
    }
    function viewSales() {
      var my = ctx.token();
      $("view").innerHTML = shell("/admin/sales", '<div id="salesBox">' + loading() + "</div>");
      sb().rpc("admin_sales_stats").then(function (r) {
        if (my !== ctx.token()) return;
        var box = $("salesBox"); if (!box) return;
        if (r.error) {
          box.innerHTML = /function|schema cache|PGRST202|404/i.test((r.error.message || "") + (r.error.code || ""))
            ? '<p class="err">매출 통계 함수가 아직 없습니다. 6단계 가이드대로 <strong>step6.sql</strong>(과 step8.sql) 을 Supabase SQL Editor에서 실행해 주세요.</p>'
            : errBox(r.error);
          return;
        }
        var s = r.data || {};
        var card = function (label, val, sub) { return '<div class="stat"><span class="stat-l">' + label + '</span><strong class="stat-v">' + esc(val) + "</strong>" + (sub ? '<span class="muted">' + esc(sub) + "</span>" : "") + "</div>"; };
        box.innerHTML = '<div class="stat-grid">' +
          card("총 매출 (결제 완료)", won(s.paid_amount), (s.paid_count || 0) + "건") +
          card("환불", won(s.refunded_amount), (s.refunded_count || 0) + "건") +
          card("결제 대기", (s.pending_count || 0) + "건", "취소 " + (s.cancelled_count || 0) + "건") +
          card("전체 회원", (s.members || 0) + "명", "") +
          card("테스트 결제", won(s.test_amount), (s.test_count || 0) + "건 · 매출 제외") + card("결제 모드", ({ off: "꺼짐", test: "테스트", live: "실결제" })[s.payment_mode] || String(s.payment_mode || "-"), "수동 지급 " + (s.manual_count || 0) + "건 제외") + "</div>" +
          '<h2 class="adm-h">월별 매출</h2>' + ((s.by_month || []).length ? bars(s.by_month, "month") : '<p class="empty-sm">결제 완료된 내역이 없습니다.</p>') +
          '<h2 class="adm-h">작품별 매출</h2>' + ((s.by_work || []).length ? bars(s.by_work, "title") : '<p class="empty-sm">결제 완료된 내역이 없습니다.</p>') +
          '<p class="fine">매출은 실제 「결제 완료」만 합산하며 테스트 결제·수동 지급은 제외합니다. 환불 금액은 매출에서 빼지 않고 따로 표시합니다. 월은 한국 시간 기준입니다.</p>';
      }, function (e) { var box = $("salesBox"); if (box && my === ctx.token()) box.innerHTML = errBox(e); });
    }

    /* ---------- 라우팅 ---------- */
    function render(path, qs) {
      var m;
      document.title = "관리자 · 문학연구소";
      if (path === "/admin") viewWorks();
      else if (path === "/admin/work/new") viewWorkForm(null);
      else if ((m = path.match(/^\/admin\/work\/([0-9a-fA-F-]{8,40})$/))) viewWorkForm(m[1]);
      else if (path === "/admin/members") viewMembers(qs);
      else if (path === "/admin/purchases") viewPurchases(qs);
      else if (path === "/admin/sales") viewSales();
      else $("view").innerHTML = shell("", '<p class="empty">없는 관리자 페이지입니다. <a class="link-btn" href="#/admin">작품 관리로</a></p>');
    }

    return { render: render, _kinds: KINDS, _defs: DEFS, _parse: parseSection, _ser: serSection };
  };
})();

</script>
  <script>
/* 문학연구소 · 4단계: Supabase 연결 + 해시 라우터 + 목록/상세 + PDF (순수 JavaScript) */
(function () {
  "use strict";

  var CFG = window.MUNHAK_CONFIG || {};
  var BOOT_HASH = location.hash || "", BOOT_SEARCH = location.search || "";   // 메일 인증/재설정 링크 처리용
  var SECTIONS = window.SECTIONS || [];
  var WORKS = [];

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* =====================================================================
     1. 데이터 계층: 'sample'(샘플) / 'db'(Supabase) / 'error'(설정 오류)
     ===================================================================== */
  var MODE = "sample", sb = null, CONFIG_ERROR = "";

  (function initClient() {
    var url = String(CFG.SUPABASE_URL || "").trim();
    var key = String(CFG.SUPABASE_ANON_KEY || "").trim();
    if (!url || !key || /YOUR_/.test(url) || /YOUR_/.test(key)) return;   // 샘플 모드

    if (!/^https:\/\/[^\s]+$/.test(url)) {
      MODE = "error"; CONFIG_ERROR = "SUPABASE_URL 형식이 올바르지 않습니다. https://xxxx.supabase.co 형태여야 합니다."; return;
    }
    // 비밀 키(service_role / secret)가 들어가면 즉시 차단: 이 키는 브라우저에 노출되면 안 됨
    var secret = /^sb_secret_/.test(key);
    if (!secret && /^eyJ/.test(key)) {
      try {
        var payload = JSON.parse(atob(key.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
        if (payload && payload.role === "service_role") secret = true;
      } catch (e) { /* 해석 실패는 무시 */ }
    }
    if (secret) {
      MODE = "error";
      CONFIG_ERROR = "비밀 키(service_role/secret)가 설정되어 있습니다. 브라우저에 노출되면 안 되는 키이므로 사용을 막았습니다. anon(public) 또는 publishable 키로 바꾸고, 노출된 비밀 키는 Supabase에서 재발급하세요.";
      return;
    }
    if (!window.supabase || !window.supabase.createClient) {
      MODE = "error"; CONFIG_ERROR = "Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요."; return;
    }
    try { sb = window.supabase.createClient(url, key); MODE = "db"; }
    catch (e) { MODE = "error"; CONFIG_ERROR = "Supabase 연결 설정 오류: " + e.message; }
  })();

  function mapRow(r) {
    return {
      uuid: r.id, id: r.slug, title: r.title, author: r.author, era: r.era || "", genre: r.genre || "",
      category: (r.categories && r.categories.slug) || "classic",
      summary: r.summary || "", access: r.access, price: r.price || 0, exam: !!r.is_exam,
      popularity: r.popularity || 0, createdAt: String(r.created_at || "").slice(0, 10)
    };
  }

  var worksPromise = null;
  function ensureWorks() {
    if (worksPromise) return worksPromise;
    if (MODE === "sample") {
      WORKS = (window.SAMPLE_WORKS || []).slice();
      worksPromise = Promise.resolve(WORKS);
    } else if (MODE === "error") {
      worksPromise = Promise.reject(new Error(CONFIG_ERROR));
    } else {
      worksPromise = sb.from("works")
        .select("id,slug,title,author,era,genre,summary,access,price,is_exam,popularity,created_at,categories(slug)")
        .eq("is_published", true)
        .then(function (res) {
          if (res.error) throw new Error(res.error.message);
          WORKS = (res.data || []).map(mapRow);
          return WORKS;
        });
    }
    worksPromise.then(null, function () { worksPromise = null; });   // 실패하면 다음에 다시 시도
    return worksPromise;
  }

  function loadDetail(w) {
    if (MODE === "sample") {
      return Promise.resolve({ d: (window.SAMPLE_DETAILS || {})[w.id] || {}, files: [], purchased: false });
    }
    return Promise.all([
      sb.from("analyses").select("section_key,body").eq("work_id", w.uuid),
      sb.from("work_files").select("id,file_name,storage_path").eq("work_id", w.uuid),
      (SESSION && w.access === "premium")
        ? sb.from("purchases").select("id").eq("user_id", userId()).eq("work_id", w.uuid).eq("status", "paid").limit(1)
        : Promise.resolve({ data: [], error: null })
    ]).then(function (r) {
      if (r[0].error) throw new Error(r[0].error.message);
      if (r[1].error) throw new Error(r[1].error.message);
      var d = {};
      (r[0].data || []).forEach(function (x) { d[x.section_key] = x.body; });
      return { d: d, files: r[1].data || [], purchased: !!(r[2] && r[2].data && r[2].data.length) };
    });
  }

  function findWork(id) {
    for (var i = 0; i < WORKS.length; i++) if (WORKS[i].id === id) return WORKS[i];
    return null;
  }

  /* =====================================================================
     2. 공통 화면 조각
     ===================================================================== */
  function priceText(w) { return w.access === "free" ? "무료" : w.price.toLocaleString("ko-KR") + "원"; }
  function badge(w) {
    return w.access === "free"
      ? '<span class="badge badge-free">무료</span>'
      : '<span class="badge badge-premium">프리미엄</span>';
  }
  function byDateDesc(a, b) { return a.createdAt < b.createdAt ? 1 : -1; }
  function byPopDesc(a, b) { return b.popularity - a.popularity; }

  function cardHTML(w) {
    var foot = MODE === "sample" ? (((window.SAMPLE_DETAILS || {})[w.id]) ? "분석 자료 보기" : "분석 준비 중") : "분석 자료 보기";
    return '<a class="card" href="#/work/' + esc(w.id) + '">' +
      '<div class="card-top">' + badge(w) +
        '<span class="badge badge-tag">' + esc(w.genre) + '</span>' +
        (w.exam ? '<span class="badge badge-tag">기출</span>' : "") +
      '</div>' +
      '<div class="card-title">' + esc(w.title) + '</div>' +
      '<div class="card-meta">' + esc(w.author) + ' · ' + esc(w.era) + '</div>' +
      '<p class="card-sum">' + esc(w.summary) + '</p>' +
      '<div class="card-foot"><span>' + foot + '</span><span class="price">' + esc(priceText(w)) + '</span></div>' +
    '</a>';
  }
  function rankHTML(w, i) {
    return '<li><a href="#/work/' + esc(w.id) + '">' +
      '<span class="rank-no">' + (i + 1) + '</span>' +
      '<span class="rank-body"><span class="rank-title">' + esc(w.title) + '</span>' +
      '<span class="rank-meta">' + esc(w.author) + ' · ' + esc(w.genre) + '</span></span>' +
      badge(w) + '</a></li>';
  }
  function gridHTML(list) {
    return list.length ? '<div class="grid">' + list.map(cardHTML).join("") + '</div>' : '<p class="empty">등록된 작품이 없습니다.</p>';
  }
  function sectionBlock(id, title, bodyHTML, moreHref) {
    return '<section class="block" id="' + id + '"><div class="wrap"><div class="block-head"><h2>' + title + '</h2>' +
      (moreHref ? '<a class="link-btn" href="' + moreHref + '">전체 보기</a>' : "") +
      '</div>' + bodyHTML + '</div></section>';
  }
  function sampleNote() {
    return MODE === "sample"
      ? '<div class="wrap"><p class="sample-note" role="note"><strong>샘플 모드</strong> — Supabase 설정 전이라 개발 확인용 샘플 데이터를 보여 줍니다. index.html 상단의 설정 값을 넣으면 데이터베이스에서 불러옵니다.</p></div>'
      : "";
  }
  function loadingHTML() { return '<div class="wrap"><p class="empty">불러오는 중…</p></div>'; }
  function errorHTML(msg) {
    return '<section class="page-top"><div class="wrap"><h1 class="page-title">데이터를 불러오지 못했습니다</h1>' +
      '<p class="err">' + esc(msg) + '</p>' +
      '<p class="fine">확인할 것: ① index.html 설정 값(URL, 키)이 맞는지 ② schema.sql / seed.sql 을 실행했는지 ③ 인터넷 연결</p>' +

  var listState = { q: "", cat: "all", access: "all", exam: false };

  function matches(w) {
    if (listState.cat !== "all" && w.category !== listState.cat) return false;
    if (listState.access !== "all" && w.access !== listState.access) return false;
    if (listState.exam && !w.exam) return false;
    var q = listState.q.replace(/\s+/g, "").toLowerCase();
    if (!q) return true;
    var hay = (w.title + w.author + w.era + w.genre).replace(/\s+/g, "").toLowerCase();
    return hay.indexOf(q) !== -1;
  }
  function chipRow(label, attr, items, current) {
    return '<div class="chips" role="group" aria-label="' + label + '">' + items.map(function (it) {
      return '<button type="button" class="chip' + (current === it[0] ? " is-on" : "") + '" ' + attr + '="' + it[0] + '">' + it[1] + '</button>';
    }).join("") + '</div>';
  }
  function syncUrl() {
    var p = [];
    if (listState.q) p.push("q=" + encodeURIComponent(listState.q));
    if (listState.cat !== "all") p.push("cat=" + listState.cat);
    if (listState.access !== "all") p.push("access=" + listState.access);
    if (listState.exam) p.push("exam=1");
    history.replaceState(null, "", "#/works" + (p.length ? "?" + p.join("&") : ""));
  }

  /* =====================================================================

  function paras(arr) { return arr.map(function (t) { return "<p>" + esc(t) + "</p>"; }).join(""); }
  function bullets(arr) { return '<ul class="bul">' + arr.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>"; }

  var RENDERERS = {
    info: function (d) {
      return '<dl class="info">' + d.map(function (r) {
        return "<div><dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd></div>";
      }).join("") + "</dl>";
    },
    author: paras, background: paras, attitude: paras, theme: paras,
    original: function (d) {
      return '<div class="poem">' + d.map(function (st) {
        return '<p class="stanza">' + st.map(function (l) { return esc(l); }).join("<br>") + "</p>";
      }).join("") + "</div>";
    },
    modern: function (d) {

        d.map(function (r) { return "<tr><td>" + esc(r.o) + "</td><td>" + esc(r.m) + "</td></tr>"; }).join("") +
        "</tbody></table></div>";
    },
    analysis: function (d) {
      return d.map(function (r) { return '<div class="ana"><h4>' + esc(r.q) + "</h4><p>" + esc(r.a) + "</p></div>"; }).join("");
    },
    structure: function (d) {
      return '<ol class="steps">' + d.map(function (r) {
        return "<li><strong>" + esc(r.part) + "</strong><span>" + esc(r.desc) + "</span></li>";
      }).join("") + "</ol>";
    },
    expression: bullets, points: bullets, summary: bullets,
    choices: function (d) {
      return d.map(function (c, i) {
        return '<div class="choice ' + (c.ok ? "ok" : "no") + '"><div class="choice-head"><span class="mark">' +
          (c.ok ? "적절함" : "적절하지 않음") + '</span><span class="choice-no">선지 ' + (i + 1) + "</span>" +
          (c.tag ? '<span class="badge badge-tag">' + esc(c.tag) + "</span>" : "") + "</div>" +
          '<p class="choice-text">' + esc(c.t) + '</p><p class="choice-why">' + esc(c.why) + "</p></div>";
      }).join("");
    },
    compare: function (d) {
      return d.map(function (r) { return '<div class="ana"><h4>' + esc(r.work) + "</h4><p>" + esc(r.text) + "</p></div>"; }).join("");
    }
  };

  function renderSection(key, data) {
    try { return RENDERERS[key](data); }
    catch (e) { return '<div class="lock lock-soft"><p>이 항목의 데이터 형식이 올바르지 않아 표시할 수 없습니다.</p></div>'; }
  }

  }
  function pendingBox() { return '<div class="lock lock-soft"><p>이 항목의 분석 자료는 아직 등록되지 않았습니다.</p></div>'; }

  function renderDetail(w, detail) {
    var d = detail.d, files = detail.files;
    var premium = w.access === "premium";
    var missing = SECTIONS.filter(function (s) { return d[s.key] === undefined; }).length;

        '<span class="toc-no">' + (i + 1) + "</span>" + esc(s.title) + "</button></li>";
    }).join("");

    var body = SECTIONS.map(function (s, i) {
      var content = d[s.key] !== undefined ? renderSection(s.key, d[s.key]) : (premium ? lockedBox() : pendingBox());
      return '<section class="sec" id="sec-' + s.key + '"><h2><span class="sec-no">' + (i + 1) + "</span>" + esc(s.title) + "</h2>" + content + "</section>";

    var buy;

    } else if (detail.purchased) {

    } else {
      buy = '<div class="buy"><span class="price big">' + esc(priceText(w)) + '</span>' +
        '<button type="button" class="btn btn-solid" data-buy="' + esc(w.id) + '">구매하기</button><span class="muted" id="payNote"></span></div>';
    }

    var fileBtns = files.map(function (f) {
      return '<button type="button" class="btn btn-ghost" data-file="' + esc(f.storage_path) + '" data-name="' + esc(f.file_name) + '">PDF 다운로드 · ' + esc(f.file_name) + "</button>";
    }).join("");
    var fileHint = (MODE === "db" && premium && !files.length)
      ? '<span class="muted">등록된 PDF가 없거나, 구매 후 이용할 수 있습니다.</span>' : "";
    var actions = '<div class="work-actions"><button type="button" class="btn btn-ghost" data-print="1">PDF로 저장 (인쇄)</button>' +

    } else if (premium && missing > 0) {

    }

    $("view").innerHTML =
      '<section class="page-top"><div class="wrap">' +
        '<nav class="crumbs" aria-label="현재 위치"><a href="#/">홈</a><a href="#/works">작품 목록</a><span>' + esc(w.title) + "</span></nav>" +
        '<div class="work-head"><div>' +
          '<div class="card-top">' + badge(w) + '<span class="badge badge-tag">' + esc(w.genre) + "</span>" +
            (w.exam ? '<span class="badge badge-tag">기출</span>' : "") + "</div>" +
          '<h1 class="page-title">' + esc(w.title) + "</h1>" +
          '<p class="card-meta">' + esc(w.author) + " · " + esc(w.era) + "</p>" +
          '<p class="lead">' + esc(w.summary) + "</p></div>" + buy + "</div>" + actions +
      "</div></section>" +
      '<div class="wrap">' + notice + "</div>" +
      '<div class="wrap detail-layout"><aside class="toc" aria-label="목차"><h3>목차</h3><ol>' + toc + "</ol></aside>" +
      '<div class="detail-body">' + body +
        '<p class="print-only">문학연구소 · 개인 학습용 자료입니다. 무단 복제·배포를 금합니다. (출력일 ' + new Date().toLocaleDateString("ko-KR") + ")</p></div></div>";
    document.title = w.title + " 분석 · 문학연구소";
    if ($("payNote")) getPayMode().then(function (m) { var n = $("payNote"); if (n) n.textContent = m === "test" ? "테스트 결제 모드 (실제 청구 없음)" : m === "off" ? "결제 준비 중" : ""; });
  }

  /* =====================================================================
     6. 안내창 / 파일 다운로드 / 인쇄
     ===================================================================== */
  var NOTICES = {
    buy:    { t: "구매하기", b: "결제 준비 중입니다." }
  };
  function showMessage(t, b) {
    $("noticeTitle").textContent = t;
    $("noticeBody").textContent = b;
    var dlg = $("noticeDialog");
    if (typeof dlg.showModal === "function") dlg.showModal(); else alert(t + "\n\n" + b);
  }

  function downloadFile(btn) {
    if (MODE !== "db") return;
    var path = btn.getAttribute("data-file"), name = btn.getAttribute("data-name");
    btn.disabled = true;
    sb.storage.from("work-files").createSignedUrl(path, 60, { download: name }).then(function (r) {
      btn.disabled = false;
      if (r.error || !r.data || !r.data.signedUrl) {
        showMessage("PDF를 내려받을 수 없습니다", "열람 권한이 없거나 파일을 찾을 수 없습니다. (" + ((r.error && r.error.message) || "알 수 없는 오류") + ")");
        return;
      }
      var a = document.createElement("a");
      a.href = r.data.signedUrl; a.rel = "noopener";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }, function (err) {
      btn.disabled = false;
      showMessage("PDF를 내려받을 수 없습니다", String(err && err.message || err));
    });
  }

  /* =====================================================================
